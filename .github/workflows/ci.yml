# Wake Me CI. Supply-chain policy: before enabling on the real repository,
# replace every action tag below with its full commit SHA (e.g. with `pinact`)
# and keep production secrets out of every job here; CI needs none.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (policy, challenges, API on embedded PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Generated contract and design tokens are up to date (incl. WCAG contrast)
        run: npm run check:generated
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  backend-postgres:
    name: API against server PostgreSQL 17 (row locks, SKIP LOCKED, roles)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wakeme
          POSTGRES_PASSWORD: wakeme
          POSTGRES_DB: wakeme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wakeme" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test --workspace @wakeme/api
        env:
          TEST_DATABASE_URL: postgres://wakeme:wakeme@localhost:5432/wakeme_test

  android:
    name: Android (unit tests incl. shared fixtures, lint, debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # 17 is the Kotlin/Java toolchain the modules compile with; 21 runs Gradle.
          java-version: |
            17
            21
      # The runner ships an Android SDK; setup-android@v3 fails (it installs the removed 'tools' package).
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      # setup-gradle also validates gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports
            apps/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (WakeMeCore tests incl. shared fixtures, app build)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version
      - name: WakeMeCore unit tests (policy and challenge parity with server fixtures)
        run: swift test --package-path WakeMeCore
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app for simulator (no signing)
        run: >
          xcodebuild -project WakeMe.xcodeproj -scheme WakeMe -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
