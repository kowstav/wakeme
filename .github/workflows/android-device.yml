# Runs the Android app on Android 17 (API 37) and Android 16 (API 36) emulators
# on KVM-enabled GitHub-hosted Linux runners: installs the debug APK, runs the
# instrumented tests and a journey against the local dev backend, cold-launches
# the app, and keeps screenshots, logcat and the alarm audio observations.
# Emulator results are not device evidence (doc 04 Stage 0 needs real phones).
name: android-device

on:
  workflow_dispatch:
  push:
    branches: [main-o7h6l5]
    paths:
      - apps/android/**
      - packages/policy-fixtures/**
      - services/api/src/entrypoints/dev.ts
      - .github/workflows/android-device.yml

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: app.wakeme.android.debug

jobs:
  emulator:
    name: Android ${{ matrix.release }} emulator (API ${{ matrix.api }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 17 is the target. On Ubuntu 24.04 hosts its image crash-looped SurfaceFlinger
          # (virtual GPU mapper: "!hasReadColorBufferDma"); other projects report it clean on
          # 26.04 hosts. Android 16 runs too, to verify the app itself on a stable image.
          - api: 37
            release: 17
            image: system-images;android-37.0;google_apis;x86_64
            runner: ubuntu-26.04
          - api: 36
            release: 16
            image: system-images;android-36;google_apis;x86_64
            runner: ubuntu-24.04
    env:
      SYSTEM_IMAGE: ${{ matrix.image }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free runner disk for the emulator's data partition
        run: |
          df -h / "$RUNNER_TEMP"
          # Preinstalled toolchains this job never uses (the Android NDK included).
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$ANDROID_HOME/ndk" || true
          df -h / "$RUNNER_TEMP"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install SDK packages and system image
        run: |
          if [ ! -x "${ANDROID_HOME:-/nonexistent}/cmdline-tools/latest/bin/sdkmanager" ]; then
            # Runner image without the Android SDK: bootstrap Google's command-line tools.
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/clt"
            curl -sSfL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt" && mv "$RUNNER_TEMP/clt/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # Downloads occasionally arrive corrupted ("Error on ZipFile unknown archive"): retry.
          for attempt in 1 2 3; do
            if "$SDKM" "cmdline-tools;latest" "platform-tools" "emulator" "platforms;android-37.0" "build-tools;37.0.0" "$SYSTEM_IMAGE" > /dev/null; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "sdkmanager attempt $attempt failed; retrying"; sleep 15
          done
          # avdmanager from the newest command-line tools: older tools created the API 37 AVD
          # with target=android-0, which another project saw crash-loop SurfaceFlinger.
          best=""; bestrev=0
          for d in "$ANDROID_HOME"/cmdline-tools/*/; do
            [ -x "${d}bin/avdmanager" ] || continue
            rev=$(sed -n 's/^Pkg.Revision=//p' "${d}source.properties" 2>/dev/null | head -n 1)
            if [ -z "$best" ] || [ "$(printf '%s\n%s\n' "$bestrev" "$rev" | sort -V | tail -n 1)" = "$rev" ]; then best="$d"; bestrev="$rev"; fi
          done
          echo "command-line tools $bestrev at $best"
          echo "AVDMANAGER=${best}bin/avdmanager" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Unit tests, lint, app and test APKs
        # Unit tests and lint also run here because ci.yml only runs on main and PRs.
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Start the local dev backend (embedded database) for the journey test
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          (cd services/api && nohup npm run dev > "$RUNNER_TEMP/dev-backend.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/healthz > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/healthz || { tail -n 40 "$RUNNER_TEMP/dev-backend.log"; exit 1; }
      - name: Start emulator
        id: boot
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          emulator -accel-check || true
          # One explicit AVD home for avdmanager and the emulator (they disagreed on the runner).
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$AVDMANAGER" create avd -n wakeme -k "$SYSTEM_IMAGE" --force
          "$AVDMANAGER" list avd
          emulator -version | head -n 1
          grep -h '^target=\|^image.sysdir' "$ANDROID_AVD_HOME"/wakeme.ini "$ANDROID_AVD_HOME"/wakeme.avd/config.ini || true
          # The default data partition is too small for the debug APK ("not enough space");
          # the emulator wants 1.2x the partition size free on the host disk.
          echo "disk.dataPartition.size=4G" >> "$ANDROID_AVD_HOME/wakeme.avd/config.ini"
          # A typical phone screen (360 x 800 dp); the default 320 x 640 px pushed buttons off screen.
          printf 'hw.lcd.width=720\nhw.lcd.height=1600\nhw.lcd.density=320\n' >> "$ANDROID_AVD_HOME/wakeme.avd/config.ini"
          df -h "$ANDROID_AVD_HOME"
          nohup emulator -avd wakeme -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -partition-size 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          sleep 20 # let QEMU start before checking that its process is alive
          booted=0
          for i in $(seq 1 120); do
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            if ! pgrep -f "qemu-system" > /dev/null; then echo "emulator process exited"; break; fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "--- emulator did not boot; emulator.log ---"; tail -n 120 "$RUNNER_TEMP/emulator.log"; adb devices; exit 1
          fi
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          echo "--- crash buffer after boot ---"; timeout 20 adb logcat -b crash -d | head -120 || true
          # boot_completed comes before the package and activity services answer reliably
          # (the last run's install hit "Can't find service: activity").
          ready=0
          for i in $(seq 1 60); do
            if timeout 10 adb shell service check package 2>/dev/null | grep -q ": found" \
              && timeout 10 adb shell service check activity 2>/dev/null | grep -q ": found" \
              && timeout 10 adb shell pm path android > /dev/null 2>&1; then ready=1; echo "system services answer after $((i * 5))s"; break; fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo "system services never answered"; exit 1; }
          sleep 30 # first-boot work (package scans, dexopt) settles
          # Emulator system dialogs ("System UI isn't responding") covered the app and took the taps.
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install and grant the permissions a user would grant in onboarding
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            for attempt in 1 2 3; do
              if timeout 300 adb install -r "$apk"; then break; fi
              [ "$attempt" = 3 ] && exit 1
              echo "install attempt $attempt failed; waiting for the package service"
              sleep 30
            done
          done
          adb shell pm grant "$APP_ID" android.permission.POST_NOTIFICATIONS
          adb shell appops set "$APP_ID" SCHEDULE_EXACT_ALARM allow
          adb logcat -c
      - name: Instrumented tests
        run: |
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
          adb shell am instrument -w -r -e notClass app.wakeme.JourneyTest "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" | tee "$RUNNER_TEMP/evidence/instrumentation.txt"
          grep -q "^OK (" "$RUNNER_TEMP/evidence/instrumentation.txt"
      - name: Cold launch and screenshot
        if: always() && steps.boot.outcome == 'success'
        run: |
          adb shell am force-stop "$APP_ID"
          adb shell am start -W -n "$APP_ID/app.wakeme.MainActivity" | tee "$RUNNER_TEMP/evidence/cold-start.txt"
          sleep 6
          adb exec-out screencap -p > "$RUNNER_TEMP/evidence/10-cold-launch.png"
          adb shell cmd uimode night yes; sleep 3
          adb exec-out screencap -p > "$RUNNER_TEMP/evidence/11-cold-launch-dark.png"
          adb shell cmd uimode night no
          adb shell settings put system font_scale 1.6; sleep 3
          adb exec-out screencap -p > "$RUNNER_TEMP/evidence/12-large-font.png"
          adb shell settings put system font_scale 1.0
          adb shell pidof "$APP_ID" && echo "process alive after launch"
      - name: Journey on the dev backend (self-setup, invite, permissions, wake-up)
        if: always() && steps.boot.outcome == 'success'
        run: |
          # A fresh install state, with the permissions a person grants during onboarding.
          adb shell pm clear "$APP_ID"
          adb shell pm grant "$APP_ID" android.permission.POST_NOTIFICATIONS
          adb shell appops set "$APP_ID" SCHEDULE_EXACT_ALARM allow
          # Android 17: reaching the dev backend at 10.0.2.2 (local network) needs this
          # debug-only permission. Older images don't define it.
          adb shell pm grant "$APP_ID" android.permission.ACCESS_LOCAL_NETWORK || echo "ACCESS_LOCAL_NETWORK not grantable on this image"
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
          adb shell am instrument -w -r -e class app.wakeme.JourneyTest "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" | tee "$RUNNER_TEMP/evidence/journey.txt"
          grep -q "^OK (" "$RUNNER_TEMP/evidence/journey.txt"
          # JUnit reports a skipped test as OK; a journey that didn't run is a failure here.
          if grep -q "AssumptionViolatedException" "$RUNNER_TEMP/evidence/journey.txt"; then echo "::error::journey skipped"; exit 1; fi
      - name: Large-screen screenshot (doc 06 resizability; navigation rail on wide screens)
        if: always() && steps.boot.outcome == 'success'
        run: |
          # After the journey the app is signed in: show the main tabs at tablet size.
          adb shell wm size 2560x1600; adb shell wm density 280; sleep 2
          adb shell am force-stop "$APP_ID"
          adb shell am start -W -n "$APP_ID/app.wakeme.MainActivity" > /dev/null; sleep 8
          adb exec-out screencap -p > "$RUNNER_TEMP/evidence/40-large-screen.png"
          adb shell wm size reset; adb shell wm density reset
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/dev-backend.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          # adb waits forever for a device; only talk to it when one is attached.
          if timeout 10 adb get-state 2>/dev/null | grep -q device; then
            timeout 60 adb pull /data/local/tmp/wakeme-evidence/. "$RUNNER_TEMP/evidence/" || true
            timeout 60 adb logcat -d > "$RUNNER_TEMP/evidence/logcat.txt" || true
          else
            echo "no emulator attached"; touch "$RUNNER_TEMP/evidence/logcat.txt"
          fi
          echo "--- observations ---"
          grep -h "WakeMeEvidence" "$RUNNER_TEMP/evidence/logcat.txt" || true
          cat "$RUNNER_TEMP"/evidence/instrumentation.txt "$RUNNER_TEMP"/evidence/journey.txt "$RUNNER_TEMP"/evidence/cold-start.txt 2>/dev/null | grep -E "TotalTime|^OK|FAILURES|Tests run|INSTRUMENTATION_STATUS: test=|INSTRUMENTATION_STATUS_CODE" || true
          echo "--- test failures ---"; grep -h -A20 "stack=" "$RUNNER_TEMP"/evidence/instrumentation.txt "$RUNNER_TEMP"/evidence/journey.txt 2>/dev/null | head -80 || true
          echo "--- crash buffer ---"; timeout 20 adb logcat -b crash -d 2>/dev/null | head -150 || true
          echo "--- crashes ---"; grep -E "FATAL EXCEPTION|AndroidRuntime: Process: $APP_ID" -A12 "$RUNNER_TEMP/evidence/logcat.txt" || echo "no app crash in logcat"
          echo "--- system process ---"; grep -E "FATAL EXCEPTION IN SYSTEM PROCESS|WATCHDOG|Watchdog: |system_server.*(died|crash)|lowmemorykiller|Low on memory" -A6 "$RUNNER_TEMP/evidence/logcat.txt" | head -80 || true
          ls -la "$RUNNER_TEMP/evidence"
      - name: Screenshots into the log (downscaled base64, for review without artifact access)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/evidence/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            convert "$f" -resize 360x "$RUNNER_TEMP/$n.small.png" 2>/dev/null || cp "$f" "$RUNNER_TEMP/$n.small.png"
            echo "=====BEGIN SCREENSHOT $n====="; base64 -w 0 "$RUNNER_TEMP/$n.small.png"; echo; echo "=====END SCREENSHOT $n====="
          done
      - name: Fail on a Wake Me crash (system-app crashes on the emulator are reported, not failed on)
        run: '! grep -A1 "FATAL EXCEPTION" "$RUNNER_TEMP/evidence/logcat.txt" | grep -q "Process: $APP_ID"'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-evidence-api${{ matrix.api }}
          path: ${{ runner.temp }}/evidence
