    post:
      operationId: createCommand
      summary: Send a quack, wake request, focus request, check-in or location request to a friend.
      tags:
        - commands
      x-wakeme-auth: device
      description: Authorized against the recipient-owned grant, recipient settings, device readiness, kill switches and aggregate rate limits in one transaction. Idempotent per idempotencyKey. Success means accepted for delivery, not that a phone rang.
      parameters:
        - name: X-WakeMe-Device
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-WakeMe-Timestamp
          in: header
          required: true
          schema:
            type: string
            description: Unix seconds
        - name: X-WakeMe-Signature
          in: header
          required: true
          schema:
            type: string
            description: base64 DER ECDSA P-256/SHA-256 over WAKEME-V1\nMETHOD\nPATH?QUERY\nTIMESTAMP\nSHA256HEX(BODY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
                - capability
                - idempotencyKey
              properties:
                targetUserId:
                  type: string
                  format: uuid
                capability:
                  anyOf:
                    - type: string
                      const: nudge.send
                    - type: string
                      const: alarm.request
                    - type: string
                      const: focus.request
                    - type: string
                      const: safety.checkin.request
                    - type: string
                      const: location.request
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                expectedGrantVersion:
                  type: integer
                  minimum: 1
                expiresInSeconds:
                  type: integer
                  minimum: 30
                  maximum: 21600
                soundId:
                  type: string
                  maxLength: 64
                ringSeconds:
                  type: integer
                  minimum: 10
                  maximum: 300
                challengeRevisionId:
                  type: string
                  format: uuid
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 120
                goal:
                  type: string
                  minLength: 1
                  maxLength: 80
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - capability
                  - actor
                  - target
                  - grantVersion
                  - payload
                  - deliveryMode
                  - expiresAt
                  - createdAt
                  - state
                  - displayStatus
                properties:
                  id:
                    type: string
                  capability:
                    type: string
                  actor:
                    type: object
                    required:
                      - id
                      - displayName
                    properties:
                      id:
                        type: string
                      displayName:
                        type: string
                  target:
                    type: object
                    required:
                      - id
                      - displayName
                    properties:
                      id:
                        type: string
                      displayName:
                        type: string
                  grantVersion:
                    type: integer
                  payload:
                    type: object
                    properties:
                      soundId:
                        type: string
                      ringSeconds:
                        type: integer
                      challengeRevisionId:
                        type: string
                      minutes:
                        type: integer
                      goal:
                        type: string
                  deliveryMode:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  state:
                    type: object
                    required:
                      - lifecycle
                      - transport
                      - device
                      - human
                      - refusedReason
                    properties:
                      lifecycle:
                        type: string
                      transport:
                        type: string
                      device:
                        type: string
                      human:
                        type: string
                      refusedReason:
                        anyOf:
                          - type: string
                          - type: "null"
                  displayStatus:
                    type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearer: []
