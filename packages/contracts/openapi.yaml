  /v1/alarm-plans/{id}/occurrences:
    post:
      operationId: reportAlarmOccurrence
      summary: Owner's phone reports an occurrence outcome. "Stopped" (OS stop) and "challenge_completed" are different outcomes.
      tags:
        - alarms
      x-wakeme-auth: device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-WakeMe-Device
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-WakeMe-Timestamp
          in: header
          required: true
          schema:
            type: string
            description: Unix seconds
        - name: X-WakeMe-Signature
          in: header
          required: true
          schema:
            type: string
            description: base64 DER ECDSA P-256/SHA-256 over WAKEME-V1\nMETHOD\nPATH?QUERY\nTIMESTAMP\nSHA256HEX(BODY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - occurrenceKey
                - version
                - outcome
              properties:
                occurrenceKey:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                version:
                  type: integer
                  minimum: 1
                outcome:
                  anyOf:
                    - type: string
                      const: rang
                    - type: string
                      const: stopped
                    - type: string
                      const: challenge_completed
                    - type: string
                      const: bypassed
                    - type: string
                      const: follow_up_rang
                    - type: string
                      const: session_ended
                    - type: string
                      const: missed_unknown
              additionalProperties: false
