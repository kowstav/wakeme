info:
  title: Wake Me API
  version: 0.1.0
  description: Alert your friends. Wake each other up. All remote actions are authorized against recipient-owned, directional, bounded grants. Success responses report acceptance and recorded evidence; they never claim a phone rang or a person woke up.
servers:
  - url: https://api.wakeme.app
