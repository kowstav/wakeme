      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
              description: Safe to show to the user.
            retryable:
              type: boolean
            requestId:
              type: string
            retryAfterSeconds:
              type: integer
            details: {}
