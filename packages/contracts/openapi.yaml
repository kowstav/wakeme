  /v1/media/uploads:
    post:
      operationId: createMediaUpload
      summary: Start a private upload of a short recorded voice or sound (WAV or M4A, up to 30 s).
      tags:
        - media
      x-wakeme-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - mime
                - bytes
                - sha256
                - durationMs
                - rightsAttestation
              properties:
                kind:
                  anyOf:
                    - type: string
                      const: voice
                    - type: string
                      const: alarm_sound
                mime:
                  anyOf:
                    - type: string
                      const: audio/wav
                    - type: string
                      const: audio/mp4
                bytes:
                  type: integer
                  minimum: 1
                  maximum: 1048576
                sha256:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                durationMs:
                  type: integer
                  minimum: 1
                  maximum: 30000
                rightsAttestation:
                  type: boolean
                  const: true
                  description: I recorded this or have the right to use it.
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - media
                  - upload
                properties:
                  media:
                    type: object
                    required:
                      - id
                      - soundId
                      - ownerId
                      - kind
                      - mime
                      - bytes
                      - durationMs
                      - state
                      - rejectionReason
                      - createdAt
                    properties:
                      id:
                        type: string
                      soundId:
                        type: string
                        description: Use as media:<id> in grants and routines once clean.
                      ownerId:
                        type: string
                      kind:
                        type: string
                      mime:
                        type: string
                      bytes:
                        type: integer
                      durationMs:
                        anyOf:
                          - type: integer
                          - type: "null"
                      state:
                        type: string
                      rejectionReason:
                        anyOf:
                          - type: string
                          - type: "null"
                      createdAt:
                        type: string
                        format: date-time
                  upload:
                    type: object
                    required:
                      - url
                      - method
                      - headers
                      - expiresAt
                    properties:
                      url:
                        type: string
                      method:
                        type: string
                      headers:
                        type: object
                        patternProperties:
                          ^.*$:
                            type: string
                      expiresAt:
                        type: string
                        format: date-time
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearer: []
