# XcodeGen spec: `xcodegen generate` writes WakeMe.xcodeproj (not committed).
name: WakeMe
options:
  bundleIdPrefix: app.wakeme
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  WakeMeCore:
    path: WakeMeCore
targets:
  WakeMe:
    type: application
    platform: iOS
    sources:
      - path: WakeMe
    dependencies:
      - package: WakeMeCore
        product: WakeMeCore
      - package: WakeMeCore
        product: WakeMeAPI
    info:
      path: WakeMe/Info.plist
      properties:
        CFBundleDisplayName: Wake Me
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Wake Me schedules the wake-ups you set or accept, so they ring even in silent mode or Focus.
        # Background app refresh tops up armed routines and catches up on changes (SyncEngine).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.wakeme.ios.sync]
        ITSAppUsesNonExemptEncryption: false
        # Non-secret configuration, set per build (e.g. xcodebuild WAKEME_API_BASE_URL=https://api.example).
        WakeMeAPIBaseURL: $(WAKEME_API_BASE_URL)
        WakeMeSupabaseURL: $(WAKEME_SUPABASE_URL)
        WakeMeSupabaseAnonKey: $(WAKEME_SUPABASE_ANON_KEY)
        # Plain HTTP only to the local dev backend; production uses HTTPS with platform trust.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wakeme.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        WAKEME_API_BASE_URL: "http://127.0.0.1:8787"
        WAKEME_SUPABASE_URL: ""
        WAKEME_SUPABASE_ANON_KEY: ""
  WakeMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WakeMeUITests
    dependencies:
      - target: WakeMe
    info:
      path: WakeMeUITests/Info.plist
      properties:
        # The journey test talks to the local dev backend (http://127.0.0.1:8787).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wakeme.ios.uitests
schemes:
  WakeMe:
    build:
      targets:
        WakeMe: all
        WakeMeUITests: [test]
    test:
      targets:
        - WakeMeUITests
