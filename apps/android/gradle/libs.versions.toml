# Versions resolved from Google Maven / Maven Central on 2026-10-18 (latest stable).
# Review and bump deliberately; do not use dynamic versions.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
room = "2.8.5"
navigation = "2.10.2"
lifecycle = "2.11.0"
activity = "1.13.0"
work = "2.12.0"
datastore = "1.2.1"
coreKtx = "1.19.1"
credentials = "1.6.0"
googleid = "1.2.1"
firebaseBom = "35.0.2"
codeScanner = "16.1.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
revenuecat = "10.28.1"
junit = "4.13.2"
robolectric = "4.17"
turbine = "1.2.1"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRules = "1.7.0"
